<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRR</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" href="favicon.png?v=1">
<meta name="apple-mobile-web-app-title" content="RRR">
<script>
// Opened from the home-screen icon (saved URL ends in ?go=1) -> go straight to the site.
if (/[?&]go=1/.test(location.search) || navigator.standalone) location.replace("https://www.roughridersregistry.com/");
</script>
<style>
body{margin:0;background:#5c1424;color:#fff;font:18px/1.5 system-ui,-apple-system,sans-serif;
     display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:0 20px}
img{width:120px;height:120px;border-radius:26px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
a.btn{display:inline-block;margin-top:18px;padding:12px 26px;border-radius:12px;background:#fff;color:#5c1424;
      font-weight:700;text-decoration:none}
small{display:block;margin-top:22px;opacity:.85;max-width:22em}
</style>
</head>
<body>
<div>
<img src="apple-touch-icon.png?v=1" alt="">
<h2>Rough Riders Registry</h2>
<a class="btn" href="https://www.roughridersregistry.com/">Open RRR</a>
<small>To add this to your Home Screen: tap Share &rarr; Add to Home Screen, turn <b>Open as Web App</b> off, then Add. The icon will open Rough Riders Registry directly.</small>
</div>
<script>
// Make the URL Safari saves for the home-screen icon the auto-redirecting one.
if (!/[?&]go=1/.test(location.search)) history.replaceState(null, "", "?go=1");
</script>
</body>
</html>
