<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVLTS MainDB Quick Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .green-text { color: #81FF3D; }
        .results-table td, .results-table th { padding: 12px 16px; border-bottom: 1px solid #222; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col">

    <!-- Header -->
    <div class="bg-black border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
        <h1 class="text-2xl font-semibold green-text tracking-tight">RSVLTS MainDB Quick Search</h1>
        <div class="text-xs text-zinc-400 px-3 py-1 bg-zinc-900 rounded">DOUBLE-ENTER EXPORT ENABLED</div>
    </div>

    <!-- Status -->
    <div id="status" class="px-4 py-2 text-sm font-medium bg-zinc-900 border-b border-zinc-800 flex flex-col gap-1 text-emerald-400">
        <div>✅ MainDB loaded successfully!</div>
        <div id="stats">Loading...</div>
    </div>

    <!-- Results -->
    <div class="flex-1 p-4 overflow-auto" id="results-container">
        <div class="bg-zinc-900 rounded-xl border border-zinc-800 overflow-auto max-h-full">
            <table id="data-table" class="results-table w-full text-sm"></table>
        </div>
    </div>

    <!-- Controls -->
    <div class="border-t border-zinc-800 bg-zinc-900 p-4 space-y-4">
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="flex items-center gap-1 text-xs text-zinc-400 mb-1"><span class="text-[#81FF3D]">📂</span> Category:</label>
                <select id="category-select" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 focus:border-[#81FF3D] focus:outline-none"></select>
            </div>
            <div>
                <label class="flex items-center gap-1 text-xs text-zinc-400 mb-1"><span class="text-[#81FF3D]">⚡</span> Quick Filter:</label>
                <select id="quick-filter-select" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 focus:border-[#81FF3D] focus:outline-none"></select>
            </div>
        </div>

        <div class="flex gap-2">
            <input id="search-input" type="text" placeholder="Search inventory..." 
                   class="flex-1 bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 focus:border-[#81FF3D] focus:outline-none">
            <button onclick="performSearch()" class="bg-[#81FF3D] hover:bg-[#9FFF5E] text-black px-6 rounded-lg font-semibold">🔎 Search</button>
        </div>

        <div class="flex gap-3">
            <button onclick="resetAll()" class="flex-1 bg-red-600 hover:bg-red-500 py-3 rounded-xl font-semibold flex items-center justify-center gap-2">🔄 Reset Search</button>
            <button onclick="exportToHTML()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-semibold flex items-center justify-center gap-2">📤 Export Results to HTML</button>
        </div>

        <p class="text-center text-xs text-zinc-500">Tip: Press Enter → Search<br>Press Enter again within 0.8s → Export to HTML</p>
    </div>

    <script>
        const CSV_URL = "https://raw.githubusercontent.com/mirdle/mrsvlts/main/maindb.csv";
        const CATEGORY_COLUMN = "Item_Type";           // ← This is your Category (Short Sleeve, Polos, etc.)
        const QUICK_FILTER_COLUMN = "Owned";          // ← Best quick filter (owned-yes / owned-no)
        const SEARCH_COLUMNS = ["Title", "Notes", "Item_Type", "Color"]; // searchable columns

        let allData = [];
        let filteredData = [];
        let lastEnterTime = 0;

        async function loadCSV() {
            const statusEl = document.getElementById('status');
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: (results) => {
                    allData = results.data.filter(row => Object.values(row).some(v => v));
                    document.getElementById('stats').innerHTML = `${allData.length} items • ${new Set(allData.map(r => r[CATEGORY_COLUMN])).size} categories`;
                    populateDropdowns();
                    renderTable(allData);
                    statusEl.innerHTML = `<div>✅ MainDB loaded successfully!</div><div class="text-emerald-400">Advanced search + DOUBLE-ENTER EXPORT enabled!</div>`;
                }
            });
        }

        function populateDropdowns() {
            // Category
            const catSelect = document.getElementById('category-select');
            const categories = [...new Set(allData.map(r => r[CATEGORY_COLUMN]).filter(Boolean))].sort();
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat; opt.textContent = cat;
                catSelect.appendChild(opt);
            });

            // Quick Filter
            const filterSelect = document.getElementById('quick-filter-select');
            const filterValues = [...new Set(allData.map(r => r[QUICK_FILTER_COLUMN]).filter(Boolean))].sort();
            filterValues.forEach(val => {
                const opt = document.createElement('option');
                opt.value = val; opt.textContent = val;
                filterSelect.appendChild(opt);
            });
        }

        function performSearch() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
            const category = document.getElementById('category-select').value;
            const quickFilter = document.getElementById('quick-filter-select').value;

            filteredData = allData.filter(row => {
                const matchesSearch = !searchTerm || SEARCH_COLUMNS.some(col => 
                    row[col] && row[col].toString().toLowerCase().includes(searchTerm)
                );
                const matchesCategory = !category || row[CATEGORY_COLUMN] === category;
                const matchesFilter = !quickFilter || row[QUICK_FILTER_COLUMN] === quickFilter;
                return matchesSearch && matchesCategory && matchesFilter;
            });

            renderTable(filteredData);
        }

        function renderTable(data) {
            const table = document.getElementById('data-table');
            table.innerHTML = '';

            if (data.length === 0) {
                table.innerHTML = `<tr><td colspan="10" class="text-center py-12 text-zinc-400">No matches found</td></tr>`;
                return;
            }

            // Header
            const thead = document.createElement('thead');
            thead.className = 'bg-zinc-800 sticky top-0';
            const headerRow = document.createElement('tr');
            Object.keys(data[0]).slice(0, 8).forEach(key => {  // adjust number of columns shown if needed
                const th = document.createElement('th');
                th.className = 'text-left text-xs font-medium text-zinc-400 uppercase tracking-wider';
                th.textContent = key;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            // Body
            const tbody = document.createElement('tbody');
            data.forEach(row => {
                const tr = document.createElement('tr');
                Object.keys(row).slice(0, 8).forEach(key => {
                    const td = document.createElement('td');
                    td.textContent = row[key] || '';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
        }

        function resetAll() {
            document.getElementById('search-input').value = '';
            document.getElementById('category-select').value = '';
            document.getElementById('quick-filter-select').value = '';
            filteredData = allData;
            renderTable(allData);
        }

        function exportToHTML() {
            let html = `<h1>RSVLTS MainDB Export - ${new Date().toLocaleString()}</h1><table border="1" style="border-collapse: collapse; width:100%;"><thead><tr>`;
            Object.keys(filteredData[0] || {}).forEach(key => html += `<th style="padding:8px;">${key}</th>`);
            html += `</tr></thead><tbody>`;
            filteredData.forEach(row => {
                html += `<tr>`;
                Object.values(row).forEach(val => html += `<td style="padding:8px;">${val || ''}</td>`);
                html += `</tr>`;
            });
            html += `</tbody></table>`;

            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `RSVLTS_MainDB_Export_${new Date().toISOString().slice(0,10)}.html`;
            a.click();
        }

        // Keyboard support (double-enter)
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const now = Date.now();
                if (now - lastEnterTime < 800) {
                    exportToHTML();
                } else {
                    performSearch();
                }
                lastEnterTime = now;
            }
        });

        // Load the app
        window.onload = loadCSV;
    </script>
</body>
</html>
