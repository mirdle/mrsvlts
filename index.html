<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RSVLTS MainDB Quick Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .green-text { color: #81FF3D; }
        .card { transition: all 0.2s ease; }
        .card:hover { transform: scale(1.03); box-shadow: 0 10px 15px -3px rgb(129 255 61); }
        .thumb-img { width: 100%; height: 180px; object-fit: cover; border-radius: 12px 12px 0 0; }
        .toast { animation: toastPop 0.3s ease, toastFade 3s forwards; }
        @keyframes toastPop { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes toastFade { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col">
    <!-- Header -->
    <div class="bg-black border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
        <h1 class="text-2xl font-semibold green-text tracking-tight">RSVLTS MainDB Quick Search</h1>
    </div>

    <!-- Status bar -->
    <div id="status" class="px-4 py-2 bg-zinc-900 border-b border-zinc-800 flex items-start justify-between text-sm">
        <div class="flex flex-col gap-1">
            <div class="text-emerald-400 font-medium">✅ MainDB loaded successfully!</div>
            <div id="version-info" class="text-[10px] text-emerald-400 font-medium">ver 2.5 • gitwanted.csv (Title + URL) + realtime GitHub sync</div>
        </div>
        <div class="flex flex-col items-end gap-1">
            <div class="flex gap-2">
                <button onclick="showGitHubSettings()" 
                        class="text-white bg-zinc-700 hover:bg-zinc-600 px-4 py-1 rounded-xl text-xs font-medium flex items-center gap-1 transition-all">
                    ⚙️ GitHub Settings
                </button>
                <button onclick="resetAll()" 
                        class="text-white bg-zinc-700 hover:bg-zinc-600 px-4 py-1 rounded-xl text-xs font-medium flex items-center gap-1 transition-all">
                    <span class="text-emerald-400">🔄</span> Reset
                </button>
            </div>
            <div id="debug" class="text-[10px] text-zinc-400 font-mono text-right"></div>
        </div>
    </div>

    <!-- Controls -->
    <div class="border-b border-zinc-800 bg-zinc-900 p-4 space-y-4">
        <div class="grid grid-cols-3 gap-3">
            <div>
                <label class="flex items-center gap-1 text-xs text-zinc-400 mb-1"><span class="text-[#81FF3D]">📂</span> Category:</label>
                <select id="category-select" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 focus:border-[#81FF3D] focus:outline-none"></select>
            </div>
            <div>
                <label class="flex items-center gap-1 text-xs text-zinc-400 mb-1"><span class="text-[#81FF3D]">⚡</span> Quick Filter:</label>
                <select id="quick-filter-select" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 focus:border-[#81FF3D] focus:outline-none"></select>
            </div>
            <div>
                <label class="flex items-center gap-1 text-xs text-zinc-400 mb-1"><span class="text-[#81FF3D]">📅</span> Date Released:</label>
                <select id="date-released-select" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 focus:border-[#81FF3D] focus:outline-none"></select>
            </div>
        </div>
        <div class="flex gap-2">
            <input id="search-input" type="text" placeholder="Search inventory... (use &quot;exact&quot; or -exclude)"
                   class="flex-1 bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 focus:border-[#81FF3D] focus:outline-none text-base">
            <button onclick="performSearch()" class="bg-[#81FF3D] hover:bg-[#9FFF5E] text-black px-6 rounded-lg font-semibold flex items-center gap-2">🔎 Search</button>
        </div>
    </div>

    <div class="flex-1 p-4 overflow-auto" id="results-container">
        <div id="results-count" class="mb-4 hidden px-2 py-2 bg-zinc-900 border border-zinc-700 rounded-2xl text-sm flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span id="result-count" class="text-[#81FF3D] font-semibold text-xl tabular-nums">0</span>
                <span class="text-zinc-400">results found</span>
            </div>
            <div class="text-xs text-zinc-500 flex items-center gap-1"><span class="text-emerald-400">↓</span> newest release first</div>
        </div>
        <div id="cards-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </div>

    <!-- GitHub Settings Modal -->
    <div id="github-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[9999]">
        <div class="bg-zinc-900 rounded-3xl p-8 max-w-md w-full mx-4">
            <h2 class="text-2xl font-semibold mb-6">GitHub Settings</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-zinc-400 mb-2">GitHub Personal Access Token</label>
                    <input id="pat-input" type="password" placeholder="ghp_xxxxxxxxxxxxxxxx" 
                           class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 focus:border-[#81FF3D] focus:outline-none">
                </div>
                <p class="text-xs text-zinc-500">
                    Token needs <strong>repo</strong> scope.<br>
                    Create one at: <a href="https://github.com/settings/tokens" target="_blank" class="text-[#81FF3D]">github.com/settings/tokens</a>
                </p>
            </div>
            <div class="flex gap-3 mt-8">
                <button onclick="saveGitHubToken()" class="flex-1 bg-[#81FF3D] text-black font-semibold py-4 rounded-2xl">Save Token</button>
                <button onclick="hideGitHubModal()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 font-medium py-4 rounded-2xl">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = "https://raw.githubusercontent.com/mirdle/mrsvlts/main/maindb.csv";
        const WANTED_CSV_URL = "https://raw.githubusercontent.com/mirdle/mrsvlts/main/gitwanted.csv";
        const REPO_OWNER = "mirdle";
        const REPO_NAME = "mrsvlts";
        const FILE_PATH = "gitwanted.csv";

        const CATEGORY_COLUMN = "Item_Type";
        const QUICK_FILTER_COLUMN = "Owned";
        const SEARCH_COLUMNS = ["Title", "Notes", "Item_Type", "Color", "Material"];

        let allData = [];
        let wantedTitles = new Set();
        let githubToken = null;

        function escapeJS(str) {
            return str ? str.toString().replace(/'/g, "\\'") : '';
        }

        function loadGitHubToken() {
            githubToken = localStorage.getItem('rsvlts_github_pat');
        }

        function saveGitHubToken() {
            const token = document.getElementById('pat-input').value.trim();
            if (token) {
                localStorage.setItem('rsvlts_github_pat', token);
                githubToken = token;
                hideGitHubModal();
                showToast('✅ GitHub token saved — realtime sync enabled!');
            }
        }

        function showGitHubSettings() {
            document.getElementById('pat-input').value = githubToken || '';
            document.getElementById('github-modal').classList.remove('hidden');
        }

        function hideGitHubModal() {
            document.getElementById('github-modal').classList.add('hidden');
        }

        async function updateGitHubWanted(newTitle, newUrl = '') {
            if (!githubToken) return;
            const trimmedTitle = newTitle.trim();
            const trimmedUrl = (newUrl || '').trim();
            try {
                const getRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: { Authorization: `token ${githubToken}` }
                });

                let sha = null;
                let currentContent = "Title,URL\n";

                if (getRes.status === 200) {
                    const data = await getRes.json();
                    sha = data.sha;
                    currentContent = atob(data.content);
                } else if (getRes.status !== 404) {
                    throw new Error('Failed to fetch file');
                }

                const rows = currentContent.trim().split('\n');
                const titles = new Set(rows.slice(1).map(r => {
                    const cols = r.split(',');
                    return cols[0].trim().replace(/^"|"$/g, '');
                }));
                if (titles.has(trimmedTitle)) return;

                const escapedTitle = trimmedTitle.replace(/"/g, '""');
                const escapedUrl = trimmedUrl.replace(/"/g, '""');
                const newRow = `"${escapedTitle}","${escapedUrl}"`;

                const newCSV = currentContent.trim() + `\n${newRow}`;

                const putRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        Authorization: `token ${githubToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Add wanted: ${trimmedTitle}`,
                        content: btoa(unescape(encodeURIComponent(newCSV))),
                        sha: sha
                    })
                });

                if (putRes.ok) showToast(`🚀 Synced to GitHub: ${trimmedTitle}`);
            } catch (err) {
                console.error(err);
                showToast('⚠️ Could not sync to GitHub (check token)');
            }
        }

        function markAsWanted(title, url = '') {
            const trimmed = title.toString().trim();
            if (!trimmed || wantedTitles.has(trimmed)) return;
            wantedTitles.add(trimmed);
            localStorage.setItem('rsvlts_wanted_titles', JSON.stringify(Array.from(wantedTitles)));
            applyWantedStatus();
            performSearch();
            updateGitHubWanted(trimmed, url);
            showToast(`⭐ ${trimmed} marked as wanted!`);
        }

        function applyWantedStatus() {
            allData.forEach(row => {
                const title = (row.Title || '').toString().trim();
                if (title && (wantedTitles.has(title) || (row.Wanted || '').trim().toLowerCase() === 'wanted-yes')) {
                    row.Wanted = 'wanted-yes';
                }
            });
        }

        async function loadCSV() {
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: (results) => {
                    allData = results.data.filter(row => Object.values(row).some(v => v && v.trim() !== ''));
                    document.getElementById('debug').innerHTML = `Loaded ${allData.length} rows`;

                    loadGitHubToken();

                    try {
                        const saved = JSON.parse(localStorage.getItem('rsvlts_wanted_titles') || '[]');
                        saved.forEach(t => t && wantedTitles.add(t.trim()));
                    } catch(e) {}

                    Papa.parse(WANTED_CSV_URL, {
                        download: true,
                        header: true,
                        skipEmptyLines: true,
                        complete: (wResults) => {
                            if (wResults.data) {
                                wResults.data.forEach(row => {
                                    const title = (row.Title || row.title || '').toString().trim();
                                    if (title) wantedTitles.add(title);
                                });
                            }
                            finalizeLoad();
                        },
                        error: () => finalizeLoad()
                    });
                }
            });
        }

        function finalizeLoad() {
            applyWantedStatus();
            populateDropdowns();
            renderEmptyState();
        }

        function populateDropdowns() {
            // Category
            const catSelect = document.getElementById('category-select');
            catSelect.innerHTML = '<option value="">All Categories</option>';
            const shortSleeve = document.createElement('option');
            shortSleeve.value = 'Short Sleeve'; shortSleeve.textContent = 'Short Sleeve';
            catSelect.appendChild(shortSleeve);
            const otherCats = [...new Set(allData.map(r => r[CATEGORY_COLUMN]).filter(Boolean))]
                .filter(c => c !== 'Short Sleeve').sort();
            otherCats.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat; opt.textContent = cat;
                catSelect.appendChild(opt);
            });

            // Quick Filter
            const filterSelect = document.getElementById('quick-filter-select');
            filterSelect.innerHTML = '<option value="">📋 All</option>';
            const filterValues = [...new Set(allData.map(r => r[QUICK_FILTER_COLUMN]).filter(Boolean))].sort();
            filterValues.forEach(val => {
                const opt = document.createElement('option');
                opt.value = val;
                opt.textContent = val === 'owned-yes' ? '✅ owned-yes' : val === 'owned-no' ? '❌ owned-no' : val;
                filterSelect.appendChild(opt);
            });
            const wantedOpt = document.createElement('option');
            wantedOpt.value = 'wanted-yes'; wantedOpt.textContent = '⭐ Wanted';
            filterSelect.appendChild(wantedOpt);
            const recentOpt = document.createElement('option');
            recentOpt.value = 'last-10-days'; recentOpt.textContent = '📅 Last 10 Days';
            filterSelect.appendChild(recentOpt);

            // Date Released
            const dateSelect = document.getElementById('date-released-select');
            dateSelect.innerHTML = '';
            ['📅 Any Date', '📅 No Release Date', '📅 Last 10 Days', '📅 Last 30 Days', '📅 Last 90 Days',
             '📅 This Year', '📅 Before 2024 d23', '📅 After 2024 d23'].forEach((text, i) => {
                const opt = document.createElement('option');
                opt.value = ['','no-release-date','last-10-days','last-30-days','last-90-days','this-year','before-2024-d23','after-2024-d23'][i];
                opt.textContent = text;
                dateSelect.appendChild(opt);
            });
            const yearSet = new Set();
            allData.forEach(row => {
                const relStr = (row.Release_Date || '').trim();
                if (relStr) {
                    const d = new Date(relStr);
                    if (!isNaN(d.getTime())) yearSet.add(d.getFullYear());
                }
            });
            Array.from(yearSet).sort((a,b)=>b-a).forEach(year => {
                const opt = document.createElement('option');
                opt.value = year.toString();
                opt.textContent = `📅 ${year}`;
                dateSelect.appendChild(opt);
            });
        }

        function matchesAdvancedSearch(row, searchTerm) {
            if (!searchTerm) return true;
            searchTerm = searchTerm.toLowerCase().trim();
            const terms = searchTerm.match(/"([^"]+)"|(\S+)/g) || [];
            const positive = [], negative = [];
            terms.forEach(t => {
                let term = t.replace(/"/g, '').trim();
                term.startsWith('-') ? negative.push(term.slice(1)) : positive.push(term);
            });
            const rowText = SEARCH_COLUMNS.map(col => (row[col] || '').toString().toLowerCase()).join(' ');
            return positive.every(term => rowText.includes(term)) && negative.every(term => !rowText.includes(term));
        }

        function matchesDateReleased(row, filterValue) {
            const releaseStr = (row.Release_Date || '').trim();
            const dateAddedStr = (row.Date_Added || '').trim();
            if (filterValue === 'no-release-date') return !releaseStr;
            if (filterValue === 'before-2024-d23') {
                const cutoff = new Date('2024-08-01');
                if (releaseStr) return new Date(releaseStr) < cutoff;
                if (dateAddedStr) return new Date(dateAddedStr) < cutoff;
                return false;
            }
            if (filterValue === 'after-2024-d23') {
                const cutoff = new Date('2024-08-01');
                if (dateAddedStr) return new Date(dateAddedStr) >= cutoff;
                if (releaseStr) return new Date(releaseStr) >= cutoff;
                return false;
            }
            if (!releaseStr) return false;
            const releaseDate = new Date(releaseStr);
            if (isNaN(releaseDate.getTime())) return false;
            const today = new Date(); today.setHours(0,0,0,0);
            const relCopy = new Date(releaseDate); relCopy.setHours(0,0,0,0);
            if (filterValue === 'last-10-days') {
                const cutoff = new Date(today); cutoff.setDate(cutoff.getDate() - 10);
                return relCopy >= cutoff;
            } else if (filterValue === 'last-30-days') {
                const cutoff = new Date(today); cutoff.setDate(cutoff.getDate() - 30);
                return relCopy >= cutoff;
            } else if (filterValue === 'last-90-days') {
                const cutoff = new Date(today); cutoff.setDate(cutoff.getDate() - 90);
                return relCopy >= cutoff;
            } else if (filterValue === 'this-year') {
                return releaseDate.getFullYear() === today.getFullYear();
            } else {
                const yearNum = parseInt(filterValue, 10);
                if (!isNaN(yearNum)) return releaseDate.getFullYear() === yearNum;
            }
            return true;
        }

        function sortByReleaseDate(data) {
            return [...data].sort((a, b) => {
                const dateA = new Date(a.Release_Date || '1900-01-01');
                const dateB = new Date(b.Release_Date || '1900-01-01');
                return dateB - dateA;
            });
        }

        function performSearch() {
            const searchTerm = document.getElementById('search-input').value;
            const category = document.getElementById('category-select').value;
            const quickFilter = document.getElementById('quick-filter-select').value;
            const dateFilter = document.getElementById('date-released-select').value;

            let filteredData = allData.filter(row => {
                const matchesSearch = matchesAdvancedSearch(row, searchTerm);
                const matchesCategory = !category || row[CATEGORY_COLUMN] === category;
                let matchesQuickFilter = true;
                if (quickFilter) {
                    if (quickFilter === 'wanted-yes') {
                        matchesQuickFilter = (row.Wanted || '').trim() === 'wanted-yes';
                    } else if (quickFilter === 'last-10-days') {
                        const tenDaysAgo = new Date(); tenDaysAgo.setDate(tenDaysAgo.getDate() - 10); tenDaysAgo.setHours(0,0,0,0);
                        matchesQuickFilter = (row.Release_Date || '') && new Date(row.Release_Date) >= tenDaysAgo;
                    } else {
                        matchesQuickFilter = row[QUICK_FILTER_COLUMN] === quickFilter;
                    }
                }
                const matchesDate = !dateFilter || matchesDateReleased(row, dateFilter);
                return matchesSearch && matchesCategory && matchesQuickFilter && matchesDate;
            });

            filteredData = sortByReleaseDate(filteredData);
            renderCards(filteredData);
        }

        function renderCards(data) {
            const container = document.getElementById('cards-container');
            const countContainer = document.getElementById('results-count');
            const countNumber = document.getElementById('result-count');
            container.innerHTML = '';
            if (data.length === 0) {
                countContainer.classList.add('hidden');
                container.innerHTML = `<div class="col-span-full text-center py-12 text-zinc-400">No matches found</div>`;
                return;
            }
            countNumber.textContent = data.length;
            countContainer.classList.remove('hidden');

            data.forEach(row => {
                const wantedIcon = (row.Wanted === 'wanted-yes') ? '⭐ ' : '';
                const ownedIcon = (row.Owned === 'owned-yes') ? '✅ ' : '';
                const isOwned = (row.Owned || '').trim().toLowerCase() === 'owned-yes';
                const isWanted = (row.Wanted || '').trim().toLowerCase() === 'wanted-yes';
                const showMarkButton = !isOwned && !isWanted;

                const cardHTML = `
                    <a href="${row.URL || '#'}" target="_blank" rel="noopener noreferrer" class="card bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-700 hover:border-[#81FF3D]/50 block">
                        ${row.Image_URL ? `<img src="${row.Image_URL}" loading="lazy" class="thumb-img w-full" alt="${row.Title}">` : ''}
                        <div class="p-4">
                            <h3 class="font-semibold text-base leading-tight mb-2 line-clamp-2">${wantedIcon}${ownedIcon}${row.Title || 'No title'}</h3>
                            <div class="text-xs text-zinc-400 space-y-1">
                                <div><span class="text-zinc-500">Type:</span> ${row.Item_Type || '-'}</div>
                                <div><span class="text-zinc-500">Bin#:</span> ${row['Bin#'] || '-'}</div>
                                <div><span class="text-zinc-500">Release:</span> ${row.Release_Date || '-'}</div>
                            </div>
                            ${(row.Notes || showMarkButton) ? `
                            <div class="mt-3 flex items-start gap-3">
                                ${row.Notes ? `<p class="flex-1 text-[10px] text-zinc-500 line-clamp-3">${row.Notes}</p>` : '<div class="flex-1"></div>'}
                                ${showMarkButton ? `
                                <button onclick="markAsWanted('${escapeJS(row.Title)}', '${escapeJS(row.URL || '')}'); event.stopPropagation(); return false;" 
                                        class="flex-shrink-0 inline-flex items-center bg-[#81FF3D] hover:bg-[#9FFF5E] text-zinc-950 text-[10px] font-semibold px-2 py-1 rounded-2xl transition-all active:scale-95 shadow-inner">
                                    ⭐ Want
                                </button>` : ''}
                            </div>` : ''}
                        </div>
                    </a>`;
                container.innerHTML += cardHTML;
            });
        }

        function resetAll() {
            document.getElementById('search-input').value = '';
            document.getElementById('category-select').value = '';
            document.getElementById('quick-filter-select').value = '';
            document.getElementById('date-released-select').value = '';
            renderEmptyState();
        }

        function renderEmptyState() {
            const container = document.getElementById('cards-container');
            const countContainer = document.getElementById('results-count');
            countContainer.classList.add('hidden');
            container.innerHTML = `<div class="col-span-full text-center py-20 text-zinc-400"><div class="text-4xl mb-4">🔎</div><p class="text-xl">Start searching to see results…</p></div>`;
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast fixed bottom-6 left-6 bg-[#81FF3D] text-black px-5 py-3 rounded-3xl font-semibold shadow-2xl flex items-center gap-2 z-[9999]';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3200);
        }

        document.addEventListener('keydown', e => { if (e.key === 'Enter') performSearch(); });
        window.onload = loadCSV;
    </script>
</body>
</html>
